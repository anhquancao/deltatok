defaults:
  - train_deltatok_geom_karolina

# Stress smoke for the decode_grad depth_head OOM fix (occ_rae.decode_grad
# now checkpoints depth_head in addition to the DA3 decoder blocks). Every
# training step must exercise the peak depth_head allocation:
#   - single largest resolution: 518x294
#   - max memory views forced (min=max=24)
#   - 6 cameras x 4 timesteps = 24 frames per sample (DDAD/Pandaset only;
#     Waymo/Once have 5 cams, VKitti is stereo => can't cleanly hit 24)
# Token-loss-only would not exercise decode_grad; geom regularisers are
# inherited from train_deltatok_geom -> train_deltatok_geom_karolina.
dataset:
  per_dataset_sampling: false
  train_dataset: "200 @ DDADSeqMultiView(DDAD_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/ddad_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=24, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=6, min_views_per_timestep=6, min_num_timesteps=4, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      200 @ PandasetSeqMultiView(PANDASET_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/pandaset_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=24, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=6, min_views_per_timestep=6, min_num_timesteps=4, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3')"

training:
  max_iter: 50
  warm_up: 5
  sanity_check_num_items: 2
  eval_num_items: 8
