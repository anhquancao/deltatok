defaults:
  - train_deltatok_flow
  - _self_

# Jean Zay overlay: same recipe as the base config, with dataset roots on the
# fsn1 working tier and the frozen DeltaTok ckpt under $TRG_WORK/deltatok_log.
dataset:
  train_dataset: "4000 @ WaymoSeqMultiView(ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/waymo_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=5, fixed_cams=[0], min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      2000 @ VKittiSeqMultiView(VKITTI_PROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/vkitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=10, min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      4000 @ DDADSeqMultiView(DDAD_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/ddad_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=6, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=6, fixed_cams=[0], min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      4000 @ PandasetSeqMultiView(PANDASET_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/pandaset_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=6, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=6, fixed_cams=[0], min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      4000 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=5, fixed_cams=[0], min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3')"
  test_dataset: "206 @ KittiSeqMultiView(KITTI_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/kitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', frame_interval=1, \
      min_memory_num_views=5, max_memory_num_views=5, reverse_seq=False, \
      z_far=50, split='val', seed=42, no_partial_views=True, \
      resolution=[(518, 168)], distill_model_name='SAM3', base_model='da3') + \
      206 @ Occ3dNuscenesSeqMultiView(NUSCENES_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_data/occ3d_nuscenes_processed', \
      seq_pkl_name='seq_surround_temporal_sub1_stride9_all.pkl', frame_interval=1, \
      min_memory_num_views=10, max_memory_num_views=10, num_views_per_timestep=6, \
      z_far=50, split='val', seed=42, no_partial_views=True, fixed_cams=[0], \
      resolution=[(518, 266)], distill_model_name='SAM3', base_model='da3')"

model:
  # Same frozen tokenizer as the base config (Karolina's
  # deltatok_surround_constGlobalRope_layer12/ckpts/current.pth), copied into
  # the repo checkpoints/ folder on Jean Zay. encode_layer: 12 and the
  # model.deltatok arch block are inherited and must keep matching it
  # (strict=True load).
  deltatok_ckpt: "checkpoints/deltatok_surround_constGlobalRope_layer12.pth"
  # MAE-style image decoder for eval-time RGB viz (frozen, eval-only). Same ckpt
  # as the overfit config; when ckpt_path is set, eval_one_epoch decodes RGB
  # panels (Flow / GT-z / GT) alongside the depth/BEV panels.
  img_decoder:
    ckpt_path: "checkpoints/occrae_img_decoder.pt"
    config_path: "third_party/GLD/configs/decoder/ViTXL"
    hidden_size: 9216
    patch_size: 14
    use_ema: true
    view_chunk_size: 0

training:
  # Per-GPU batch size; effective_bsize: 32 comes from the base config and the
  # trainer derives grad_cum (2 nodes x 4 H100 = 8 ranks x bsize 4 -> grad_cum 1).
  bsize: 16
  # Each batch decodes up to bsize*24 high-res JPEGs per rank; the base
  # config's 4 workers starve the GPU. gpu_p6 gives 24 cpus/task; 12 workers
  # keeps prefetch RAM within the per-GPU memory share (24 OOM'd the node).
  num_workers: 12
