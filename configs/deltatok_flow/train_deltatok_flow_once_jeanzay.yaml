defaults:
  - train_deltatok_flow_jeanzay
  - _self_

# DATA swap of train_deltatok_flow_waymo_jeanzay: same 5-cam surround layout and
# item shape, on ONCE instead of Waymo — 843k vs 122k train seqs (~6.9x). Model,
# frozen tokenizer, img_decoder and training schedule are inherited unchanged.
# num_ctx_deltas=2 in the SLURM script: 3 given frames, 2 forecast (waymo arm: 1).
dataset:
  # 16 held-out ONCE scenes = 264 val seqs. Referenced by BOTH dataset strings via
  # ${dataset._once_val_scenes} so the train exclusion and the val selection stay
  # identical (no leak). Picked as the cheapest 16 covering a 256-item eval draw:
  # they cost 2311 of 845311 train seqs (0.27%); an even spread cost 24075 (2.85%).
  # once_pairs.py's 2 built-in val_scenes are NOT here — split=None returns them to train.
  _once_val_scenes:
    - "000016"
    - "000071"
    - "000089"
    - "000156"
    - "000213"
    - "000279"
    - "000283"
    - "000286"
    - "000295"
    - "000296"
    - "000368"
    - "000401"
    - "000419"
    - "000490"
    - "000519"
    - "000546"
  # Train: ONCE minus the 16 val scenes (split=None + exclude_scenes, so once_pairs.py's
  # own val_scenes filter is bypassed and exclude_scenes is the only split).
  # num_views_per_timestep=5 is only the physical seq layout; every item is 5
  # consecutive timesteps x cam 0 at (518,266).
  # 32000/epoch = 1000 steps/epoch at effective_bsize 32 -> 100k steps over 100 epochs.
  train_dataset: "32000 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_fs1_once_5cam_all.pkl', \
      num_timesteps=5, num_views_per_timestep=5, fixed_cams=[0], \
      z_far=50, split=None, exclude_scenes=${dataset._once_val_scenes}, \
      resolution=[(518, 266)])"
  # Val: the 16 held-out scenes (264 seqs available, 256 drawn -> no repeats).
  # Fixed 5-timestep x cam-0, single (518,266), seed=42. Non-fs1 pkl, as the waymo arm.
  # NOT comparable to the Waymo arm's eval: different scenes and dataset.
  test_dataset: "256 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      num_timesteps=5, num_views_per_timestep=5, fixed_cams=[0], \
      z_far=50, split=None, select_scenes=${dataset._once_val_scenes}, seed=42, \
      resolution=[(518, 266)])"
