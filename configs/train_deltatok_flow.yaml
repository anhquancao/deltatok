exp_name: "deltatok_flow"

dataset:
  # Dust3r-style dataset expression strings evaluated by
  # `occany.datasets.get_data_loader` (same data path as train_deltatok_karolina).
  per_dataset_sampling: true
  train_dataset: "2000 @ WaymoSeqMultiView(ROOT='/scratch/project/eu-25-92/data/waymo_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=5, min_views_per_timestep=1, min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      1000 @ VKittiSeqMultiView(VKITTI_PROCESSED_ROOT='/scratch/project/eu-25-92/data/vkitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=10, min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      2000 @ DDADSeqMultiView(DDAD_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/ddad_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=6, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=6, min_views_per_timestep=1, min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      2000 @ PandasetSeqMultiView(PANDASET_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/pandaset_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=6, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=6, min_views_per_timestep=1, min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      2000 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=24, \
      num_views_per_timestep=5, min_views_per_timestep=1, min_num_timesteps=2, ray_map_prob=-1, \
      z_far=50, split='train', no_partial_views=True, \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3')"
  test_dataset: "206 @ KittiSeqMultiView(KITTI_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/kitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', frame_interval=1, \
      min_memory_num_views=5, max_memory_num_views=5, reverse_seq=False, \
      z_far=50, split='val', seed=42, no_partial_views=True, \
      resolution=[(518, 168)], distill_model_name='SAM3', base_model='da3') + \
      206 @ Occ3dNuscenesSeqMultiView(NUSCENES_PREPROCESSED_ROOT='/scratch/project/eu-25-92/data/occ3d_nuscenes_processed', \
      seq_pkl_name='seq_surround_temporal_sub1_stride9_all.pkl', frame_interval=1, \
      min_memory_num_views=10, max_memory_num_views=10, num_views_per_timestep=6, \
      z_far=50, split='val', seed=42, no_partial_views=True, fixed_cams=[0,1], \
      resolution=[(518, 266)], distill_model_name='SAM3', base_model='da3')"

model:
  vit_size: "xlarge"
  vit_dit_adaln: false         # per-block AdaLN-Zero + Gaussian-Fourier t-embed (RAE/DiT recipe); false = legacy shared 8-chunk modulation
  vit_use_camera_rope: false   # rotary over the camera (spatial) axis in the flow ViT; enable via EXTRA_CFG
  vit_use_camera_embed: false  # absolute learned per-camera identity over the flow-ViT camera axis; enable via EXTRA_CFG
  cond_mode: cross       # cross | delta_ctx | delta_ctx_cross | delta_ctx_incontext (delta_ctx = first delta token as clean in-seq context, no cross-attn; delta_ctx_cross = delta_ctx + frame-0 cross-attn; delta_ctx_incontext = delta_ctx + frame-0 patch grid CONCATENATED in-sequence, one global attention with per-token AdaLN, no cross-attn — requires attn_mode=global + vit_dit_adaln)
  attn_mode: factorized  # factorized | global (global = one attention over all delta tokens)

  # Temporal slot capacity: must be >= max T-1 transitions per item (worst case
  # above: max_memory_num_views=24 with min_views_per_timestep=1 -> T-1 = 23).
  # Only the first T-1 rows of the temporal embedding are looked up per forward,
  # so oversizing costs only unused embedding rows (no DDP unused-param issue:
  # a partial nn.Embedding lookup still yields one dense grad for the weight).
  num_views: 256
  pred_mode: "x"
  loss_mode: "v"
  sampler_step_mode: "ode"  # eval sampler update: ode = v-conversion Euler | damped = VGGT-World blend-to-x_hat (no 1/(1-t) error amplification)
  sampler_scheduler_mode: "cosine"  # eval sampler t grid: cosine | square | linear (linear = uniform in t)
  sampler_alpha: 0.5  # per-frame t stagger; 0 = every slot shares one t per step (pairs with t_shared)
  mu: -0.7
  sigma: 1.4
  t_dist: "logitnormal"  # train t: logitnormal(mu,sigma) | uniform (~10x more mass near t=1)
  t_shared: false  # true = one t per sample broadcast to all slots; matches sampler_alpha=0
  train_fixed_t: null  # set (e.g. 0) to train at one fixed t matching the 1-step eval; null = sample from t_dist
  fixed_noise_mode: "none"  # overfit probe: none=re-sampled prior | per_slot=one cached draw, distinct per (transition,camera) | shared=one vector to every slot
  # Parameter-free layer norm on the frame-0 conditioning feats (delta tokens
  # are ~unit-scale after DeltaTok's LayerNorm; raw DA3 feats are not).
  ctx_norm: "layernorm"
  occany_recon_ckpt: "checkpoints/occany_plus_recon_1B.pth"
  encode_layer: 12  # must match the frozen DeltaTok checkpoint below

  # RAE-style whitening of the delta tokens (LayerNorm normalizes rows, not channels,
  # so the flow's isotropic noise gives each channel a different SNR).
  # latent_stats_*.pth from compute_deltatok_latent_stats.py — (C,) per-channel or
  # (K, C) per delta-slot (--stats_mode position); null = no-op. Must match the
  # tokenizer above — a whitened ckpt is meaningless without its stats.
  whiten_stats: null

  # Frozen DeltaTok tokenizer providing the delta tokens the flow model diffuses.
  # Architecture must match the checkpoint (strict=True load).
  deltatok_ckpt: "/mnt/proj1/eu-25-92/deltatok_log/deltatok_surround_constGlobalRope_layer12/ckpts/current.pth"
  deltatok:
    num_delta_tokens: 1   # K delta tokens/camera; must match the frozen ckpt (override to 32 for dtok32)
    target_channels: 0    # z channel bottleneck; must match the frozen ckpt (e.g. 768 for a _tc768 tokenizer)
    bottleneck_pre_norm: false  # must match the frozen ckpt (true for a tokenizer trained with the pre-norm fix)
    num_hidden_layers: 12
    use_swiglu: true
    use_qk_norm: true
    use_gated_attn: true
    use_rope_aug: false
    use_camera_rope: false   # enable via EXTRA_CFG=model.deltatok.use_camera_rope=true (tokenizer must match)
    norm_affine: true   # override to false for a non-affine (_noaff) frozen tokenizer
    mlp_ratio: 4
    layer_scale_init: 1.0e-5
    initializer_range: 0.02

training:
  lr: 1e-4
  lr_schedule: "cosine"  # cosine | constant (post-warmup; warm_up linear ramp always applies)
  weight_decay: 0.05
  optimizer: "adamw"
  use_ema: false
  dtype: "bfloat16"
  global_epoch: 0
  iter: 0
  warm_up: 1000
  max_iter: 100000
  epoch: 100
  bsize: 1
  # Global batch size per optimizer step; the trainer derives grad_cum =
  # effective_bsize / (world_size * bsize). Cluster overlays only set bsize.
  effective_bsize: 32
  num_workers: 4
  val_num_workers: 2
  grad_clip: 1.0
  seed: 0
  # Overfit: memoize the frozen OccRAE(~1B)+DeltaTok encode per sample (keyed by
  # scene + exact frame ids + timesteps) so the backbone runs once per unique input.
  cache_frozen_encode: false
  eval_num_items: 256
  eval_num_steps: 50
  eval_num_visualizations: 8
  sanity_check_num_items: 2
  # Stop cleanly after an epoch ckpt when the SLURM wall is near (chain-resume
  # safe). Off here; enabled via EXTRA_CFG in the JZ SLURM scripts.
  exit_before_time_limit: false
  time_limit_safety_min: 2.0  # extra margin (min) beyond one epoch's duration
