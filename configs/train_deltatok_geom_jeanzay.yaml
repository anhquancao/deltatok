defaults:
  - train_deltatok_jeanzay
  - train_deltatok_geom

# H100-80GB has the memory headroom that A100-40GB lacks, so disable the DA3
# decoder gradient checkpointing that train_deltatok_geom.yaml enables — the
# un-checkpointed backward is faster when it fits. (Inline self is composed
# last, so this overrides train_deltatok_geom's `true`.)
training:
  use_decode_grad_checkpoint: false
