# OccRAE Image Decoder: MAE decoder on 3-level decode features

exp_name: "occrae_img_decoder"

dataset:
  # When true, each sub-dataset uses its own min/max_memory_num_views in the
  # sampler. When false, all sub-datasets share the first dataset's values.
  per_dataset_sampling: true
  train_dataset: "10000 @ WaymoSeqMultiView(ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/waymo_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=20, \
      num_views_per_timestep=5, min_views_per_timestep=1, ray_map_prob=-1, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      5000 @ VKittiSeqMultiView(VKITTI_PROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/vkitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=10, ray_map_prob=-1, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      10000 @ DDADSeqMultiView(DDAD_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/ddad_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=6, frame_interval=1, max_memory_num_views=20, \
      num_views_per_timestep=6, min_views_per_timestep=1, ray_map_prob=-1, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      10000 @ PandasetSeqMultiView(PANDASET_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/pandaset_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=6, frame_interval=1, max_memory_num_views=20, \
      num_views_per_timestep=6, min_views_per_timestep=1, ray_map_prob=-1, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3') + \
      10000 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      min_memory_num_views=5, frame_interval=1, max_memory_num_views=20, \
      num_views_per_timestep=5, min_views_per_timestep=1, ray_map_prob=-1, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)], \
      reverse_seq=True, distill_model_name='SAM3', base_model='da3')"
  test_dataset: "206 @ KittiSeqMultiView(KITTI_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/kitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', frame_interval=1, \
      min_memory_num_views=5, max_memory_num_views=5, reverse_seq=False, \
      z_far=50, split='val', seed=42, \
      resolution=[(518, 168)], distill_model_name='SAM3', base_model='da3') + \
      206 @ Occ3dNuscenesSeqMultiView(NUSCENES_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/occ3d_nuscenes_processed', \
      seq_pkl_name='seq_surround_temporal_sub1_stride9_all.pkl', frame_interval=1, \
      min_memory_num_views=18, max_memory_num_views=18, num_views_per_timestep=6, \
      z_far=50, split='val', seed=42, \
      resolution=[(518, 294)], distill_model_name='SAM3', base_model='da3')"

occrae:
  weights_path: checkpoints/occany_plus_recon_1B.pth
  encode_layer: 12

decoder:
  config_path: third_party/GLD/configs/decoder/ViTXL
  patch_size: 14
  hidden_size: 9216    # 3072 * 3 (3 DA3-Giant levels with cat_token)

training:
  epochs: 100
  ema_decay: 0.9978
  view_chunk_size: 8
  batch_size: 1  # We are using different number of views per item, so batch_size > 2 will throw error.
  num_workers: 8
  val_num_workers: 2
  log_interval: 100
  seed: 0
  dtype: "bfloat16"
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 50
    base_lr: 2.0e-4
    final_lr: 2.0e-5

gan:
  disc:
    arch:
      dino_ckpt_path: checkpoints/dino_vit_small_patch8_224.pth
      ks: 9
      norm_type: bn
      using_spec_norm: true
      recipe: S_8
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 1
      decay_end_epoch: 16
      base_lr: 2.0e-4
      final_lr: 2.0e-5
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    recon_weight: 1.0
    disc_start: 6
    disc_upd_start: 4
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1