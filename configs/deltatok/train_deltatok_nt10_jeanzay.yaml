defaults:
  - train_deltatok_jeanzay
  - _self_

# num_timesteps=10 overlay for max_gap >= 5 (pkl stride9 records hold exactly 10 slots)
dataset:
  train_dataset: "4000 @ WaymoSeqMultiView(ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/waymo_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_fs1_all.pkl', \
      num_timesteps=10, num_views_per_timestep=5, \
      min_views_per_timestep=1, max_views_per_timestep=2, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      2000 @ VKittiSeqMultiView(VKITTI_PROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/vkitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      num_timesteps=10, fixed_cams=[0], \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      4000 @ DDADSeqMultiView(DDAD_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/ddad_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_fs1_all.pkl', \
      num_timesteps=10, num_views_per_timestep=6, \
      min_views_per_timestep=1, max_views_per_timestep=2, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      4000 @ PandasetSeqMultiView(PANDASET_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/pandaset_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_fs1_all.pkl', \
      num_timesteps=10, num_views_per_timestep=6, \
      min_views_per_timestep=1, max_views_per_timestep=2, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      4000 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_fs1_once_5cam_all.pkl', \
      num_timesteps=10, num_views_per_timestep=5, \
      min_views_per_timestep=1, max_views_per_timestep=2, \
      z_far=50, split='train', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)])"
  # BSC's eval sets: the JZ base still reads the corrupted nuScenes copy
  test_dataset: "256 @ KittiSeqMultiView(KITTI_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/kitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      num_timesteps=5, fixed_cams=[0], \
      z_far=50, split='val', seed=42, window_stride=15, \
      resolution=[(518, 168)]) + \
      206 @ KittiSeqMultiView(KITTI_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/kitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      num_timesteps=5, fixed_cams=[0], \
      z_far=50, split='val', seed=42, \
      resolution=[(518, 168)]) + \
      256 @ Occ3dNuscenesSeqMultiView(NUSCENES_PREPROCESSED_ROOT='/lustre/fsn1/projects/rech/trg/uyl37fq/occany_dataset/occ3d_nuscenes_val_preprocessed', \
      seq_pkl_name='seq_surround_temporal_sub1_stride9_fs1_occ3d_nuscenes_val_all.pkl', \
      num_timesteps=5, num_views_per_timestep=6, fixed_cams=[0,1], \
      z_far=50, split='val', seed=42, window_stride=10, \
      resolution=[(518, 266)])"
