exp_name: "deltatok"

dataset:
  # Same dataset path as `train_occrae_img_decoder.yaml`: dust3r-style dataset
  # expression strings evaluated by `occany.datasets.get_data_loader`.
  train_dataset: "10000 @ WaymoSeqMultiView(ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/waymo_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      num_timesteps=5, num_views_per_timestep=5, fixed_cams=[0], \
      z_far=50, split='train', distill_model_name='SAM3', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      5000 @ VKittiSeqMultiView(VKITTI_PROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/vkitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      num_timesteps=5, fixed_cams=[0], \
      z_far=50, split='train', distill_model_name='SAM3', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      10000 @ DDADSeqMultiView(DDAD_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/ddad_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      num_timesteps=5, num_views_per_timestep=6, fixed_cams=[0], \
      z_far=50, split='train', distill_model_name='SAM3', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      10000 @ PandasetSeqMultiView(PANDASET_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/pandaset_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      num_timesteps=5, num_views_per_timestep=6, fixed_cams=[0], \
      z_far=50, split='train', distill_model_name='SAM3', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)]) + \
      10000 @ OnceSeqMultiView(ONCE_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/once_processed', \
      seq_pkl_name='seq_surround_temporal_sub5_stride9_all.pkl', \
      num_timesteps=5, num_views_per_timestep=5, fixed_cams=[0], \
      z_far=50, split='train', distill_model_name='SAM3', \
      resolution=[(518, 294), (518, 280), (518, 266), (518, 210), (518, 168)])"
  # nuScenes is 2 Hz keyframes: sub1 = 0.5 s, the spacing sub5 buys on the 10 Hz sets.
  test_dataset: "206 @ KittiSeqMultiView(KITTI_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/kitti_processed', \
      seq_pkl_name='seq_exact_len_sub5_stride9.pkl', \
      num_timesteps=5, fixed_cams=[0], \
      z_far=50, split='val', seed=42, distill_model_name='SAM3', \
      resolution=[(518, 168)]) + \
      206 @ Occ3dNuscenesSeqMultiView(NUSCENES_PREPROCESSED_ROOT='/gpfs/scratch/ehpc558/quan/occrae_data/occ3d_nuscenes_processed', \
      seq_pkl_name='seq_surround_temporal_sub1_stride9_all.pkl', \
      num_timesteps=5, num_views_per_timestep=6, fixed_cams=[0, 1, 2], \
      z_far=50, split='val', seed=42, distill_model_name='SAM3', \
      resolution=[(518, 294)])"

model:
  num_views: 4  # must equal max_stride + 1
  occany_recon_ckpt: "checkpoints/occany_plus_recon_1B.pth"
  encode_layer: 12

  # Optional pretrained image decoder (occrae/img_decoder_trainer.py output).
  # When ckpt_path is set, eval_one_epoch decodes RGB from predicted tokens and
  # logs side-by-side panels alongside depth. Leave ckpt_path null to skip.
  img_decoder:
    # Resolved from train_occrae_img_decoder_karolina.yaml:
    #   output_dir=/mnt/proj1/eu-25-92/occrae_output, exp_name=occrae_img_decoder
    # → train_occrae_img_decoder.py writes ckpts to <output_dir>/<exp_name>/ckpts/.
    ckpt_path: /mnt/proj1/eu-25-92/occrae_output/occrae_img_decoder/ckpts/current.pt
    config_path: "third_party/GLD/configs/decoder/ViTXL"
    hidden_size: 9216
    patch_size: 14
    use_ema: true
    view_chunk_size: 0

  # DeltaTok tokenizer architecture. hidden_size / num_heads / patch_size are
  # inherited from the OccRAE/DA3 backbone and not configurable here.
  deltatok:
    num_hidden_layers: 12
    num_delta_tokens: 1  # delta tokens per camera per transition (1 = max compression)
    target_channels: 0  # z channel bottleneck (0 = off; e.g. 768 projects z 1536->768 at encode, back at decode)
    bottleneck_mlp: false  # bottleneck only: 2-layer SiLU MLP down/up instead of single Linear (beats linear-768 variance cap)
    use_delta: true
    use_swiglu: true
    use_qk_norm: true
    use_gated_attn: true
    use_rope_aug: false
    use_camera_rope: false
    norm_affine: true  # learnable z-norm; slurm may override to false for fixed unit-var/zero-mean latent
    z_norm: true  # false removes the z-norm entirely (SIGReg then regularizes a free z, not one pinned to a sphere)
    mlp_ratio: 4
    layer_scale_init: 1.0e-5
    initializer_range: 0.02

training:
  lr: 1.0e-3  # peak; cosine-decayed to min_lr_ratio*lr after warmup (anti blow-up, see adapt_learning_rate)
  min_lr_ratio: 0.01  # cosine floor -> min lr = 1e-5
  weight_decay: 0.01
  dtype: "bfloat16"
  global_epoch: 0
  iter: 0
  warm_up: 5000
  max_iter: 100000
  epoch: 100
  bsize: 1
  num_workers: 4
  val_num_workers: 2
  # grad_cum = effective_bsize / (world_size * bsize).
  effective_bsize: 16
  max_gap: 1  # sample pair gap ~ U[1, max_gap]; 1 = adjacent frames only
  # Downstream DA3 feature loss: re-insert predicted frames into the GT token sequence,
  # run one frozen forward (blocks 13->39) over all views, and log-cosh-match the
  # out_layer [19,27,33,39] features vs the GT decode. 0 = off (no-op).
  feature_loss_weight: 0.0
  # Stage 2: freeze everything but the channel bottleneck (needs target_channels != hidden_size).
  freeze_except_bottleneck: false
  # Auxiliary log-cosh loss making z_proj_up(z_proj_down(z)) reconstruct the full 1536-d z:
  # a direct linear-autoencoder signal on the bottleneck, not routed through the decoder.
  # 0 = off; only meaningful with target_channels > 0.
  bottleneck_recon_weight: 0.0
  grad_clip: 1.0
  grad_skip_thresh: 0.0  # >0 skips optim steps whose pre-clip grad_norm exceeds this (finite-spike guard)
  # Additive composition: sample 3 timesteps/sequence, encode both hops, and make
  # d(t0->t1) + d(t1->t2) decode f_t2 from f_t0. Needs z_norm=false (a sum leaves the
  # LN sphere). 0 = off; the single-pair path is then bit-identical.
  compose_weight: 0.0
  # SIGReg (LeJEPA) anti-collapse loss on the z bottleneck: pushes the compressed
  # latent toward isotropic N(0,I) so it uses its full budget (tc768 collapses to
  # rank ~290). 0 = off (only meaningful with target_channels > 0).
  sigreg_weight: 0.0
  sigreg_num_slices: 256  # random 1D projections per step (more = lower-variance estimate)
  sigreg_warmup: 0  # linear ramp of sigreg_weight over N iters (0 = constant from step 0)
  # Rolling FIFO pool of recent z rows the estimator runs over, as a GLOBAL row count
  # (each rank holds 1/world_size of it; the CF all-reduce pools ranks). Sized to clear the
  # finite-sample floor -- ~0.0085 at S=128,C=768, which buries a rank-290 collapse. Pressure
  # is rescaled by pool/live, so this is an estimator knob only, independent of sigreg_weight.
  # NOTE the queue fires every micro-batch, so at a given sigreg_weight the pressure is
  # grad_cum x the pre-queue code's (and no longer varies with grad_cum) -- sigreg arms from
  # before that change are not weight-comparable.
  sigreg_pool_samples: 8192
  sigreg_gap_sigma: false  # z/√gap before SIGReg (Brownian: Var ∝ gap)
  # z-spread diagnostics (Eval/<test>/Z*): effective rank of the z covariance, i.e. how
  # much of the Cz budget the code uses. One measurement per eval loader, over that
  # loader's rows pooled across ranks. Runs with or without SIGReg -- that is what makes
  # a sigreg arm and its plain twin comparable.
  eval_z_spread: true
  seed: 0
  eval_num_items: 256
  eval_num_visualizations: 8
  sanity_check_num_items: 2
  # Keep a permanent epoch_<N>.pth copy of current.pth every N epochs (0 = off).
  save_ckpt_every_n_epochs: 0
  # Stop cleanly after an epoch ckpt when the SLURM wall is near (chain-resume
  # safe). Off here; enabled via EXTRA_CFG in the JZ SLURM scripts.
  exit_before_time_limit: false
  time_limit_safety_min: 2.0  # extra margin (min) beyond one epoch's duration