<style>
  :root {
    --bg: #ffffff;

    --card-bg: #f8fafc;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 48px 56px;
    max-width: 1280px;
    margin: 0 auto;

  .header {

  .header h1 {

    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
    margin-bottom: 6px;
    text-wrap: balance;

  .header .subtitle {

    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .header .subtitle span {
    display: inline-block;
    margin-right: 20px;
  }

  .charts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .chart-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 6px;
    padding: 20px 20px 16px;
    position: relative;
  }

  .chart-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .chart-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .improvement-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--badge-text);
    background: var(--badge-bg);
    border: 1px solid var(--badge-border);
    border-radius: 4px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .chart-canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 3;
  }

  .chart-canvas-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .legend {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-top: 32px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .legend-swatch {
    width: 18px;
    height: 3px;
    border-radius: 1.5px;
  }

  .legend-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  .final-vals {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;

  .final-val {

    gap: 4px;
  }

  .final-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;

  }

function drawChart(canvasId, metric) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width;
  const H = rect.height;

  const bData = DATA.baseline[metric];
  const cData = DATA.compose[metric];

  // Compute axis bounds
  const allVals = [...bData.values, ...cData.values];
  const allEps = [...bData.epochs, ...cData.epochs];
  const minEp = 0;
  const maxEp = Math.ceil(Math.max(...allEps));
  let minVal = Math.min(...allVals);
  let maxVal = Math.max(...allVals);
  const valPad = (maxVal - minVal) * 0.08;
  minVal = Math.max(0, minVal - valPad);
  maxVal = maxVal + valPad;

  // Layout
  const ml = 42, mr = 12, mt = 6, mb = 28;
  const pw = W - ml - mr;
  const ph = H - mt - mb;

  function toX(ep) { return ml + (ep - minEp) / (maxEp - minEp) * pw; }
  function toY(v) { return mt + (1 - (v - minVal) / (maxVal - minVal)) * ph; }

  // Grid lines — y axis
  const style = getComputedStyle(document.documentElement);
  const gridColor = style.getPropertyValue('--grid').trim();
  const textSecondary = style.getPropertyValue('--text-secondary').trim();
  const baselineColor = style.getPropertyValue('--baseline').trim();
  const composeColor = style.getPropertyValue('--compose').trim();
  const baselineFill = style.getPropertyValue('--baseline-fill').trim();
  const composeFill = style.getPropertyValue('--compose-fill').trim();

  // Nice y-tick intervals
  const range = maxVal - minVal;
  const rawStep = range / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const niceSteps = [1, 2, 2.5, 5, 10];
  let step = niceSteps.find(s => s * mag >= rawStep) * mag;

  const yStart = Math.ceil(minVal / step) * step;

  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;
  ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.fillStyle = textSecondary;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';

  for (let v = yStart; v <= maxVal; v += step) {
    const y = Math.round(toY(v)) + 0.5;
    ctx.beginPath();
    ctx.moveTo(ml, y);
    ctx.lineTo(W - mr, y);
    ctx.stroke();
    ctx.fillText(v % 1 === 0 ? v.toFixed(0) : v.toFixed(1), ml - 6, y);
  }

  // X axis labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const xStep = maxEp <= 20 ? 5 : maxEp <= 50 ? 10 : 20;
  for (let ep = 0; ep <= maxEp; ep += xStep) {
    const x = toX(ep);
    ctx.fillText(ep.toString(), x, H - mb + 8);
  }

  // X-axis label
  ctx.fillStyle = textSecondary;
  ctx.font = '10px "IBM Plex Sans", sans-serif';
  ctx.fillText('epoch', ml + pw / 2, H - 2);

  // Draw area fills
  function drawArea(data, fillStyle) {
    if (data.epochs.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(toX(data.epochs[0]), toY(minVal));
    for (let i = 0; i < data.epochs.length; i++) {
      ctx.lineTo(toX(data.epochs[i]), toY(data.values[i]));
    }
    ctx.lineTo(toX(data.epochs[data.epochs.length - 1]), toY(minVal));
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }

  drawArea(bData, baselineFill);
  drawArea(cData, composeFill);

  // Draw lines
  function drawLine(data, color, width) {
    if (data.epochs.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(toX(data.epochs[0]), toY(data.values[0]));
    for (let i = 1; i < data.epochs.length; i++) {
      ctx.lineTo(toX(data.epochs[i]), toY(data.values[i]));
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  drawLine(bData, baselineColor, 1.8);
  drawLine(cData, composeColor, 2);

  // End dots
  function drawDot(ep, val, color) {
    ctx.beginPath();
    ctx.arc(toX(ep), toY(val), 3, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  drawDot(bData.epochs[bData.epochs.length - 1], bData.values[bData.values.length - 1], baselineColor);
  drawDot(cData.epochs[cData.epochs.length - 1], cData.values[cData.values.length - 1], composeColor);
}

function drawAll() {
  drawChart('c-pointmap', 'LossPointmap');
  drawChart('c-depth', 'LossDepth');
  drawChart('c-raymap', 'LossRaymap');
}

drawAll();
window.addEventListener('resize', drawAll);
</script>
